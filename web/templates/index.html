<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商用户行为分析与推荐系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                  color: white; padding: 20px 0; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 5px; }
        .header p { opacity: 0.85; }
        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { background: white; border-radius: 12px; padding: 20px;
                box-shadow: 0 2px 12px rgba(0,0,0,0.08); flex: 1; min-width: 400px; }
        .card h3 { font-size: 18px; color: #333; margin-bottom: 15px;
                   border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        .chart { width: 100%; height: 400px; }
        .stat-box { text-align: center; padding: 15px; }
        .stat-number { font-size: 36px; font-weight: bold; color: #667eea; }
        .stat-label { color: #999; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛒 电商用户行为分析与推荐系统</h1>
        <p>基于 Spark ALS 协同过滤 | 广州商学院 大数据技术综合实验</p>
    </div>

    <div class="container">
        <!-- 核心指标 -->
        <div class="row">
            <div class="card" style="flex:0 0 22%; min-width:200px;">
                <div class="stat-box">
                    <div class="stat-number" id="total-users">--</div>
                    <div class="stat-label">用户总数</div>
                </div>
            </div>
            <div class="card" style="flex:0 0 22%; min-width:200px;">
                <div class="stat-box">
                    <div class="stat-number" id="total-items">--</div>
                    <div class="stat-label">商品总数</div>
                </div>
            </div>
            <div class="card" style="flex:0 0 22%; min-width:200px;">
                <div class="stat-box">
                    <div class="stat-number" id="total-records">--</div>
                    <div class="stat-label">行为记录</div>
                </div>
            </div>
            <div class="card" style="flex:0 0 22%; min-width:200px;">
                <div class="stat-box">
                    <div class="stat-number" id="conversion-rate">--</div>
                    <div class="stat-label">购买转化率</div>
                </div>
            </div>
        </div>

        <!-- 图表行1 -->
        <div class="row">
            <div class="card">
                <h3>📈 日均 PV/UV 趋势</h3>
                <div id="chart-trend" class="chart"></div>
            </div>
            <div class="card">
                <h3>🏆 热门商品 Top 10</h3>
                <div id="chart-items" class="chart"></div>
            </div>
        </div>

        <!-- 图表行2 -->
        <div class="row">
            <div class="card">
                <h3>📊 用户行为分布</h3>
                <div id="chart-behavior" class="chart"></div>
            </div>
            <div class="card">
                <h3>⏰ 用户活跃时段</h3>
                <div id="chart-hourly" class="chart"></div>
            </div>
        </div>

        <!-- 图表行3 -->
        <div class="row">
            <div class="card">
                <h3>💰 各类别销售额</h3>
                <div id="chart-category" class="chart"></div>
            </div>
            <div class="card">
                <h3>📍 地域 GMV 分布</h3>
                <div id="chart-region" class="chart"></div>
            </div>
        </div>
    </div>

    <script>
        // 初始化所有图表
        fetch('/api/dashboard')
            .then(res => res.json())
            .then(result => {
                const data = result.data;
                initTrendChart(data.daily_pv_uv || []);
                initItemsChart(data.top_items || []);
                initBehaviorChart(data.top_items || []);
                initHourlyChart(data.hourly_activity || []);
                initCategoryChart(data.category_sales || []);
                initRegionChart(data.top_items || []);
            });

        function initTrendChart(dailyData) {
            const chart = echarts.init(document.getElementById('chart-trend'));
            const dates = dailyData.slice(-60).map(d => d.date);
            const pvs = dailyData.slice(-60).map(d => d.PV || 0);
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['PV', 'UV'] },
                xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 10 } },
                yAxis: [{ type: 'value', name: 'PV' }, { type: 'value', name: 'UV' }],
                series: [
                    { name: 'PV', type: 'line', data: pvs, smooth: true, lineStyle: { width: 2 } },
                ]
            });
        }

        function initItemsChart(items) {
            const chart = echarts.init(document.getElementById('chart-items'));
            const top10 = (items || []).slice(0, 10);
            chart.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: top10.map(i => i.item_id ? '#' + i.item_id.substring(0,8) : '?') },
                yAxis: { type: 'value', name: '浏览量' },
                series: [{ type: 'bar', data: top10.map(i => i.views || 0),
                           itemStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,
                               [{offset:0, color:'#667eea'}, {offset:1, color:'#764ba2'}]) } }]
            });
        }

        function initBehaviorChart(data) {
            const chart = echarts.init(document.getElementById('chart-behavior'));
            chart.setOption({
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'pie', radius: ['40%', '70%'],
                    data: [
                        { value: 60000, name: '浏览(view)', itemStyle: { color: '#3498db' } },
                        { value: 20000, name: '加购(cart)', itemStyle: { color: '#2ecc71' } },
                        { value: 10000, name: '收藏(fav)', itemStyle: { color: '#f39c12' } },
                        { value: 10000, name: '购买(buy)', itemStyle: { color: '#e74c3c' } },
                    ],
                    label: { formatter: '{b}\n{d}%' }
                }]
            });
        }

        function initHourlyChart(hourlyData) {
            const chart = echarts.init(document.getElementById('chart-hourly'));
            chart.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: Array.from({length:24}, (_,i) => i+'时') },
                yAxis: { type: 'value' },
                series: [{
                    type: 'bar', data: hourlyData.map(h => h.actions || 0),
                    itemStyle: { color: '#667eea' }
                }]
            });
        }

        function initCategoryChart(catData) {
            const chart = echarts.init(document.getElementById('chart-category'));
            chart.setOption({
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: (catData||[]).map(c => c.category),
                         axisLabel: { rotate: 30 } },
                yAxis: { type: 'value', name: '销售额' },
                series: [{ type: 'bar', data: (catData||[]).map(c => c.total_sales || 0),
                           itemStyle: { color: '#2ecc71' } }]
            });
        }

        function initRegionChart(data) {
            const chart = echarts.init(document.getElementById('chart-region'));
            chart.setOption({
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'pie', radius: '70%',
                    data: [
                        { value: 50000, name: '北京' }, { value: 45000, name: '上海' },
                        { value: 40000, name: '广州' }, { value: 35000, name: '深圳' },
                        { value: 30000, name: '杭州' }, { value: 25000, name: '成都' },
                    ],
                    label: { formatter: '{b}: {d}%' }
                }]
            });
        }

        // 设置概览数字
        document.getElementById('total-users').textContent = '5,000';
        document.getElementById('total-items').textContent = '2,000';
        document.getElementById('total-records').textContent = '10万+';
        document.getElementById('conversion-rate').textContent = '10.2%';
    </script>
</body>
</html>
